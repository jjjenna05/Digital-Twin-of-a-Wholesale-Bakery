<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav class="navBar">
      <span class="navTitle">Bakery</span>
        <div class="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="config.html" class="active">Config</a>
            <a href="#">Compare</a>
         </div>
   </nav>

   <main class="config">
      <h1>Config</h1>
      <div class="configTabs">
         <button type="button" class="active" data-tab="steps-tab">Steps</button>
         <button type="button" data-tab="units-tab">Units</button>
         <button type="button" data-tab="roles-tab">Roles</button>
         <button type="button" data-tab="equipment-tab">Equipment</button>
         <button type="button" data-tab="recipe-tab" >Recipe</button>
         <button type="button" data-tab="preferences-tab" >Preferences</button>
      </div>     
         <section id="equipment-tab">
            <table class="list">
               <thead>
                  <tr>
                     <th>Name</th>
                     <th>Can do</th>
                     <th>Quantity</th>
                     <th>Capacity per batch</th>
                     <th>Loads</th>
                     <th>Switch time</th>
                     <th>Warm up</th>
                     <th>Turn on</th>              
                  </tr>
               </thead>
               <tbody id="equipment-row"></tbody>
            </table>
            <button type="button" id="add-equipment">+ Add Equipment</button>
            <dialog id="equipment-dialog">
              <form id="equipment-form">
                <h2>Add Equipment</h2>
            
                <label>Name <input name="name"></label>
            
                <p>Can do</p>
                <div id="can-do-boxes"></div>
            
                <label>Quantity <input name="quantity" type="number"></label>
            
                <label>Capacity per batch <input name="capacityAmount" type="number"></label>
                <select id="equipment-unit" name="capacityUnit"></select>
            
                <label>Loads
                  <select name="loads">
                    <option>When full</option>
                    <option>One by one</option>
                  </select>
                </label>
            
                <label>Switch time (min) <input name="switchTime" type="number" placeholder="None"></label>
                <label>Warm up (min) <input name="warmUpTime" type="number" placeholder="None"></label>
            
                <label>Turn on
                  <select name="turnOn">
                    <option>At shift start</option>
                    <option>When first needed</option>
                  </select>
                </label>
            
                <button type="button" id="cancel-equipment">Cancel</button>
                <button type="submit">Save</button>
              </form>
            </dialog>
         </section>
         <section id="steps-tab" hidden>
            <table class="list">
               <thead>
                  <tr>
                     <th>Step Name</th>
                     <th>Kind</th>
                  </tr>
               </thead>
               <tbody id="steps-row"></tbody>
            </table>
         </section>
         <section id="units-tab" hidden>
            <table class="list">
               <thead>
                  <tr>
                     <th>Unit</th>
                     <th>Equals</th>
                     <th>How many</th>
                  </tr>
               </thead>
               <tbody id="units-row"></tbody>
            </table>
         </section>
         <section id="roles-tab" hidden>
            <table class="list">
               <thead>
                  <tr>
                     <th>Role</th>
                     <th>Can do</th>
                  </tr>
               </thead>
               <tbody id="roles-row"></tbody>
            </table>
         </section>
         <section id="recipe-tab" hidden>
            <table class="list">
               <thead>
                  <tr>
                     <th>Item Name</th>
                     <th>Steps</th>
                     <th>Made from</th>
                  </tr>
               </thead>
               <tbody id="recipe-row"></tbody>
            </table>
            
         </section> 
   </main>
   <script src="config.js"></script>
</body>
</html>
