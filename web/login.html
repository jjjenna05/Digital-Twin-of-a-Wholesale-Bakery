<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav class="navBar">
      <span class="navTitle">Bakery</span>
   </nav>

   <main class="login">
      <div class="loginBox">
         <h1>Login</h1>
         <form>
            <label>
               User ID
               <input type="text" name="userID" autocomplete="username" required>
            </label>
            <button type="submit">Log in</button>
         </form>
      </div>
   </main>
</body>
</html>
