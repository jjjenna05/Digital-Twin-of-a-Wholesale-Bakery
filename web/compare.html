<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compare Scenarios</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="compare.css">
    <script src="nav.js" defer></script>
</head>
<body>
    <nav class="navBar">
        <span class="navTitle">Bakery</span>
        <div class="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="config.html">Config</a>
            <a href="compare.html" class="active">Compare</a>
        </div>
        <div class="navUser">
           <span id="userName"></span>
           <button id="logoutBtn" type="button">Log out</button>
        </div>
    </nav>

    <main>
        <h1>Compare Scenarios</h1>

        <div class="tabs" role="tablist" aria-label="Choose a scenario">
            <button id="scenario-1-tab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="scenario-1-panel">Scenario 1</button>
            <button id="scenario-2-tab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="scenario-2-panel">Scenario 2</button>
        </div>

        <p id="selection-error" class="selection-error" role="alert" hidden></p>
        <section id="scenario-1-panel" class="scenario-panel" role="tabpanel" aria-labelledby="scenario-1-tab">
            <h2>Scenario 1</h2>
            <div class="table" role="table" aria-label="Saved simulations for Scenario 1">
                <div class="row head" role="row">
                    <span class="c1" role="columnheader">Simulation Name</span>
                    <span class="c2" role="columnheader">Order Name</span>
                    <span class="c3" role="columnheader">Bakery Config Name</span>
                    <span class="actions" aria-hidden="true"></span>
                </div>
                <div class="simulation-rows" data-scenario="1"></div>
            </div>
        </section>
        <section id="scenario-2-panel" class="scenario-panel" role="tabpanel" aria-labelledby="scenario-2-tab" hidden>
            <h2>Scenario 2</h2>
            <div class="table" role="table" aria-label="Saved simulations for Scenario 2">
                <div class="row head" role="row">
                    <span class="c1" role="columnheader">Simulation Name</span>
                    <span class="c2" role="columnheader">Order Name</span>
                    <span class="c3" role="columnheader">Bakery Config Name</span>
                    <span class="actions" aria-hidden="true"></span>
                </div>
                <div class="simulation-rows" data-scenario="2"></div>
            </div>
        </section>
    </main>

    <button type="button" class="next" id="compare-button">Compare</button>
    <script src="compare.js" defer></script>
</body>
</html>
