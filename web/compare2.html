<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compare Scenarios</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="compare.css">
    <script src="nav.js" defer></script>
</head>
<body>
    <nav class="navBar">
        <span class="navTitle">Bakery</span>
        <div class="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="config.html">Config</a>
            <a href="compare.html" class="active">Compare</a>
        </div>
        <div class="navUser">
           <span id="userName"></span>
           <button id="logoutBtn" type="button">Log out</button>
        </div>
    </nav>

    <main>
        <h1>Compare Scenarios</h1>

        <div class="tabs" role="tablist">
            <button class="tab" role="tab" onclick="window.location.href='compare.html'">Scen 1</button>
            <button class="tab active" role="tab" onclick="window.location.href='compare2.html'">Scen 2</button>
        </div>

        <div class="table">
            <div class="row head">
                <span class="c1">Input Order</span>
                <span class="c2">Bakery Config</span>
            </div>
            <div class="row body">
                <span class="c1">Input 2</span>
                <span class="c2">Config 2</span>
                <div class="actions">
                    <button type="button">Save</button>
                    <button type="button" class="delete">Delete</button>
                </div>
            </div>
            <div class="row body">
                <span class="c1">Input 1</span>
                <span class="c2">Config 1</span>
                <div class="actions">
                    <button type="button">Save</button>
                    <button type="button" class="delete">Delete</button>
                </div>
            </div>
            <div class="row body">
                <span class="c1">Input 1</span>
                <span class="c2">Config 2</span>
                <div class="actions">
                    <button type="button">Save</button>
                    <button type="button" class="delete">Delete</button>
                </div>
            </div>
        </div>
    </main>

    <button type="button" class="next">Next</button>

    <script>
                document.querySelectorAll('.tab').forEach(function (tab) {
                    tab.addEventListener('click', function () {
                        document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
                        tab.classList.add('active');
                    });
                });
    </script>
</body>
</html>
