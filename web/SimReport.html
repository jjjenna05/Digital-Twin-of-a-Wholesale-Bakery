<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Report | Bakery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="SimReport.css" />
  <script src="nav.js" defer></script>
</head>
<body>
  <header class="navBar">
    <span class="navTitle">Bakery</span>
    <nav class="navLinks" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="config.html">Config</a>
      <a href="compare.html">Compare</a>
    </nav>
    <div class="navUser">
       <span id="userName"></span>
       <button id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <main>
    <div class="pageHeader">
      <h1>Results</h1>
      <div class="downloadMenu" data-csv-name="simulation-report.csv">
        <button class="pdfButton" id="downloadBtn" type="button" aria-haspopup="menu" aria-expanded="false">Download &#9662;</button>
        <div class="downloadOptions" role="menu" hidden>
          <button type="button" role="menuitem" data-format="pdf">PDF</button>
          <button type="button" role="menuitem" data-format="csv">CSV</button>
        </div>
      </div>
    </div>

    <p class="reportMessage" id="reportMessage" role="status">Loading results...</p>

    <div id="report" hidden>
      <div class="tableWrap">
        <table class="resultsTable">
          <thead>
            <tr>
              <th scope="col" class="col-item">Item</th>
              <th scope="col" class="col-quantity">Quantity</th>
              <th scope="col" class="col-due">Due</th>
              <th scope="col" class="col-ready">Ready</th>
              <th scope="col" class="col-status">Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <!-- one "Find out why" section per late order, filled by SimReport.js -->
      <div id="lateSections" hidden></div>

      <section class="breakdowns" aria-label="Staff and equipment breakdown">
        <div class="breakdown" id="staffBreakdown">
          <h2>Staff working breakdown</h2>

          <div class="legend">
            <span><i class="working"></i>working</span>
            <span><i class="waiting"></i>waiting for work</span>
          </div>
        </div>

        <div class="breakdown" id="equipmentBreakdown">
          <h2>Equipment Usage breakdown</h2>
          <p class="breakdownNote" id="equipmentNote"></p>

          <div class="legend">
            <span><i class="inUse"></i>in use</span>
            <span><i class="waitingForWorker"></i>waiting for worker</span>
            <span><i class="switching"></i>switching</span>
            <span><i class="warming"></i>warming up</span>
            <span><i class="idle"></i>idle</span>
          </div>
        </div>
      </section>

      <section class="stepsSection" aria-labelledby="steps-title">
        <h2 id="steps-title">Time per step</h2>
        <div class="tableWrap">
          <table class="stepsTable">
            <thead>
              <tr id="stepsHead">
                <th scope="col">Product</th>
                <th scope="col" id="stepsTotalHead">Total</th>
              </tr>
            </thead>
            <tbody id="stepsBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="actions">
      <button class="secondaryButton" id="newSimulation" type="button">New simulation</button>
      <button class="primaryButton" id="compareRun" type="button">Compare this with another run</button>
    </div>
  </main>

  <script src="SimReport.js"></script>
  <script src="download.js"></script>
</body>
</html>
